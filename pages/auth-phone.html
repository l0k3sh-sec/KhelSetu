<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KhelSetu — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/auth-phone.css">
</head>
<body>

  <main class="auth-layout">
    <div class="auth-card">

      <!-- SECTION 1: PHONE ENTRY -->
      <div id="phoneEntrySection">
        <header class="auth-header">
          <div class="auth-brand">
            <span class="auth-logo-text">KhelSetu</span>
            <span class="auth-logo-dot" aria-hidden="true"></span>
          </div>
          <p class="auth-subtitle">Democratizing Grassroots Sports</p>
        </header>

        <div class="auth-toggle" id="authMethodToggle" role="tablist" aria-label="Authentication Method">
          <button type="button" class="auth-toggle-btn active" id="authTogglePhone" role="tab" aria-selected="true" aria-controls="authPhoneFields">Phone</button>
          <button type="button" class="auth-toggle-btn" id="authToggleEmail" role="tab" aria-selected="false" aria-controls="authEmailFields">Email</button>
        </div>

        <form class="auth-form" id="authForm">
          <div class="auth-field-group" id="authPhoneFields">
            <label class="auth-label" for="phoneInput">Enter your mobile number</label>
            <p class="auth-instruction">We will send you a 6-digit OTP code</p>

            <div class="auth-input-composite">
              <select class="auth-country-select" id="countryCodeSelect" aria-label="Country calling code">
                <option value="+91" selected>+91</option>
                <option value="+1">+1</option>
                <option value="+44">+44</option>
              </select>
              <input type="tel" class="auth-input auth-phone-input" id="phoneInput" placeholder="98765 43210" pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel-national">
            </div>
          </div>

          <div class="auth-field-group auth-hidden" id="authEmailFields">
            <label class="auth-label" for="emailInput">Enter your email address</label>
            <p class="auth-instruction">We will send a magic login link to your inbox</p>
            <input type="email" class="auth-input" id="emailInput" placeholder="rahul.verma@example.com" autocomplete="email">
          </div>

          <!-- Invisible reCAPTCHA container required by Firebase -->
          <div id="recaptcha-container"></div>

          <button type="submit" class="auth-btn-primary" id="btnSendOtp">Send OTP</button>

          <div class="auth-terms">
            <input type="checkbox" class="auth-checkbox" id="termsCheckbox" checked>
            <label class="auth-terms-label" for="termsCheckbox">By proceeding, you agree to biometric assessment terms.</label>
          </div>
        </form>
      </div>

      <!-- SECTION 2: OTP VERIFICATION (Hidden by default) -->
      <div id="otpVerificationSection" class="auth-hidden">
        <button type="button" class="verify-back-btn" id="btnBackToPhone">&#8592; Back</button>

        <header class="verify-header">
          <h1 class="verify-title">Verify Phone</h1>
          <p class="verify-subtitle" id="verifySubtitle">Code sent to +91 98765-43210</p>
        </header>

        <form class="verify-form" id="verifyForm">
          <div class="otp-input-group" id="otpInputGroup">
            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          </div>

          <div class="verify-resend-container">
            <span class="resend-timer" id="resendTimer"></span>
            <button type="button" class="btn-resend" id="btnResendOtp" disabled>Resend Code</button>
          </div>

          <button type="submit" class="verify-btn-primary" id="btnVerifyOtp">VERIFY</button>
        </form>
      </div>

    </div>
  </main>

  <script src="../js/shared.js"></script>
  <!-- MUST be type="module" for Firebase imports to work -->
  <script type="module" src="../js/auth-phone.js"></script>
</body>
</html>
